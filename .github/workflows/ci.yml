name: Alloyed DevOps Multitool CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build-and-smoke:
    name: gha/native-build-and-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, windows-latest]

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Verify generated ports are up-to-date
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ports/Sync-PortsFromCatalog.ps1
          $changed = git status --porcelain -- `
            src/powershell/Public/Ports.Wrappers.ps1
          if (-not [string]::IsNullOrWhiteSpace(($changed | Out-String))) {
            Write-Error "Generated ports files are out-of-date. Run tools/ports/Sync-PortsFromCatalog.ps1 and commit changes."
            $changed
            exit 1
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore Alloyed.DevOps.Multitool.slnx --verbosity minimal

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null
          dotnet build Alloyed.DevOps.Multitool.slnx -c Debug --no-restore 2>&1 | Tee-Object -FilePath artifacts/test-results/build.log

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/dotnet/Alloyed.DevOps.Multitool.Tests.Unit/Alloyed.DevOps.Multitool.Tests.Unit.csproj -c Debug --no-build `
            --logger "trx;LogFileName=unit.trx" `
            --results-directory artifacts/test-results

      - name: Integration tests
        shell: pwsh
        run: |
          dotnet test tests/dotnet/Alloyed.DevOps.Multitool.Tests.Integration/Alloyed.DevOps.Multitool.Tests.Integration.csproj -c Debug --no-build `
            --logger "trx;LogFileName=integration.trx" `
            --results-directory artifacts/test-results

      - name: End-to-end smoke
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/Smoke.Module.Tests.ps1

      - name: CI metrics summary
        if: always()
        shell: pwsh
        run: |
          $resultsDir = "artifacts/test-results"
          $buildLog = Join-Path $resultsDir "build.log"

          $warningCount = 0
          $errorCount = 0
          if (Test-Path -LiteralPath $buildLog) {
            $buildText = Get-Content -Raw -LiteralPath $buildLog
            $warningCount = ([regex]::Matches($buildText, "(?im):\s*warning\s")).Count
            $errorCount = ([regex]::Matches($buildText, "(?im):\s*error\s")).Count
          }

          function Get-TrxCounters {
            param([string]$Path)

            if (-not (Test-Path -LiteralPath $Path)) {
              return [pscustomobject]@{ Total = 0; Passed = 0; Failed = 0; Skipped = 0; Duration = "n/a" }
            }

            [xml]$trx = Get-Content -LiteralPath $Path
            $counters = $trx.TestRun.ResultSummary.Counters
            $times = $trx.TestRun.Times
            $duration = "n/a"
            if ($times.start -and $times.finish) {
              try {
                $durationSpan = ([datetime]$times.finish) - ([datetime]$times.start)
                $duration = [string]::Format("{0:hh\\:mm\\:ss}", $durationSpan)
              } catch { }
            }

            return [pscustomobject]@{
              Total = [int]$counters.total
              Passed = [int]$counters.passed
              Failed = [int]$counters.failed
              Skipped = [int]$counters.notExecuted
              Duration = $duration
            }
          }

          $unit = Get-TrxCounters -Path (Join-Path $resultsDir "unit.trx")
          $integration = Get-TrxCounters -Path (Join-Path $resultsDir "integration.trx")

          @"
          ## .NET CI Metrics

          | Metric | Value |
          |---|---:|
          | Build warnings | $warningCount |
          | Build errors | $errorCount |
          | Unit tests total | $($unit.Total) |
          | Unit tests failed | $($unit.Failed) |
          | Unit tests duration | $($unit.Duration) |
          | Integration tests total | $($integration.Total) |
          | Integration tests failed | $($integration.Failed) |
          | Integration tests duration | $($integration.Duration) |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  container-smoke:
    name: gha/container-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Build container image via compose
        run: docker compose -f compose.yaml build

      - name: Run container smoke via compose
        run: docker compose -f compose.yaml run --rm build
