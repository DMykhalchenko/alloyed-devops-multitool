name: Alloyed DevOps Multitool

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      module_version:
        description: "Stable module version (without prerelease suffix), e.g. 0.3.0"
        required: false
        default: ""
      prerelease_label:
        description: "Preview label prefix, e.g. preview"
        required: false
        default: "preview"
      prerelease_iteration:
        description: "Preview iteration number, e.g. 1"
        required: false
        default: "1"
  schedule:
    # Weekly on Sundays, 03:30 UTC
    - cron: "30 3 * * 0"

permissions:
  contents: read
  packages: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: gha/lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Run Super-Linter (slim)
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          FILTER_REGEX_EXCLUDE: "(^|/)(bin|obj|out|artifacts|super-linter-output)/"
          VALIDATE_CSHARP: true
          VALIDATE_POWERSHELL: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true

  build-and-test:
    name: gha/build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, windows-latest]

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Verify generated ports are up-to-date
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ports/Sync-PortsFromCatalog.ps1
          $changed = git status --porcelain -- `
            src/powershell/Public/Ports.Wrappers.ps1
          if (-not [string]::IsNullOrWhiteSpace(($changed | Out-String))) {
            Write-Error "Generated ports files are out-of-date. Run tools/ports/Sync-PortsFromCatalog.ps1 and commit changes."
            $changed
            exit 1
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore Alloyed.DevOps.Multitool.slnx --verbosity minimal

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null
          dotnet build Alloyed.DevOps.Multitool.slnx -c Release --no-restore 2>&1 | Tee-Object -FilePath artifacts/test-results/build.log

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/dotnet/Alloyed.DevOps.Multitool.Tests.Unit/Alloyed.DevOps.Multitool.Tests.Unit.csproj `
            -c Release --no-build `
            --logger "trx;LogFileName=unit.trx" `
            --results-directory artifacts/test-results

      - name: Integration tests
        shell: pwsh
        run: |
          dotnet test tests/dotnet/Alloyed.DevOps.Multitool.Tests.Integration/Alloyed.DevOps.Multitool.Tests.Integration.csproj `
            -c Release --no-build -m:1 `
            --logger "trx;LogFileName=integration.trx" `
            --results-directory artifacts/test-results

      - name: End-to-end smoke
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/Smoke.Module.Tests.ps1

      - name: CI metrics summary
        if: always()
        shell: pwsh
        run: |
          $resultsDir = "artifacts/test-results"
          $buildLog = Join-Path $resultsDir "build.log"

          $warningCount = 0
          $errorCount = 0
          if (Test-Path -LiteralPath $buildLog) {
            $buildText = Get-Content -Raw -LiteralPath $buildLog
            $warningCount = ([regex]::Matches($buildText, "(?im):\s*warning\s")).Count
            $errorCount = ([regex]::Matches($buildText, "(?im):\s*error\s")).Count
          }

          function Get-TrxCounters {
            param([string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) {
              return [pscustomobject]@{ Total = 0; Passed = 0; Failed = 0; Skipped = 0; Duration = "n/a" }
            }
            [xml]$trx = Get-Content -LiteralPath $Path
            $counters = $trx.TestRun.ResultSummary.Counters
            $times = $trx.TestRun.Times
            $duration = "n/a"
            if ($times.start -and $times.finish) {
              try {
                $durationSpan = ([datetime]$times.finish) - ([datetime]$times.start)
                $duration = [string]::Format("{0:hh\\:mm\\:ss}", $durationSpan)
              } catch { }
            }
            return [pscustomobject]@{
              Total    = [int]$counters.total
              Passed   = [int]$counters.passed
              Failed   = [int]$counters.failed
              Skipped  = [int]$counters.notExecuted
              Duration = $duration
            }
          }

          $unit        = Get-TrxCounters -Path (Join-Path $resultsDir "unit.trx")
          $integration = Get-TrxCounters -Path (Join-Path $resultsDir "integration.trx")

          @"
          ## CI Metrics

          | Metric | Value |
          |---|---:|
          | Build warnings | $warningCount |
          | Build errors | $errorCount |
          | Unit tests total | $($unit.Total) |
          | Unit tests failed | $($unit.Failed) |
          | Unit tests duration | $($unit.Duration) |
          | Integration tests total | $($integration.Total) |
          | Integration tests failed | $($integration.Failed) |
          | Integration tests duration | $($integration.Duration) |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  container-smoke:
    name: gha/container-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Build container image via compose
        run: docker compose -f compose.yaml build

      - name: Run container smoke via compose
        run: docker compose -f compose.yaml run --rm build

  publish-preview:
    name: gha/publish-preview
    needs: [lint, build-and-test, container-smoke]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Resolve publish version
        id: version
        shell: pwsh
        run: |
          $overrideVersion = "${{ inputs.module_version }}"
          if (-not [string]::IsNullOrWhiteSpace($overrideVersion)) {
            $moduleVersion = $overrideVersion
            $prerelease = "${{ inputs.prerelease_label }}${{ inputs.prerelease_iteration }}"
          } else {
            $manifestPath = "src/powershell/Alloyed.DevOps.Multitool.psd1"
            $content = Get-Content -Raw -LiteralPath $manifestPath
            if ($content -match "ModuleVersion\s*=\s*'([^']+)'") {
              $moduleVersion = $Matches[1]
            } else {
              throw "Unable to parse ModuleVersion from $manifestPath"
            }
            $prerelease = "preview$(Get-Date -Format 'yyyyMMdd')"
          }
          $fullVersion = "$moduleVersion-$prerelease"
          "module_version=$moduleVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease"         >> $env:GITHUB_OUTPUT
          "full_version=$fullVersion"      >> $env:GITHUB_OUTPUT

      - name: Publish preview module to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ./tools/publishing/Publish-PreviewModule.ps1 `
            -Owner "${{ github.repository_owner }}" `
            -Repository "${{ github.event.repository.name }}" `
            -ModuleVersion "${{ steps.version.outputs.module_version }}" `
            -Prerelease "${{ steps.version.outputs.prerelease }}" `
            -SkipIfVersionExists

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.full_version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "Preview release published to GitHub Packages." \
              --prerelease \
              --target "${{ github.sha }}"
          fi
