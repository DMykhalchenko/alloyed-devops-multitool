name: Publish Preview PowerShell Module

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: "Stable module version (without prerelease suffix), e.g. 0.2.0"
        required: true
        default: "0.2.0"
      prerelease_label:
        description: "Preview label prefix, e.g. preview"
        required: true
        default: "preview"
      prerelease_iteration:
        description: "Preview iteration number, e.g. 1"
        required: true
        default: "1"
      skip_build:
        description: "Skip dotnet build (use existing binaries)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: publish-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-preview:
    name: gha/publish-preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x

      - name: Run Super-Linter (slim)
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          FILTER_REGEX_EXCLUDE: "(^|/)(bin|obj|out|artifacts|super-linter-output)/"
          VALIDATE_CSHARP: true
          VALIDATE_POWERSHELL: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true

      - name: Publish preview module to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prerelease = "${{ inputs.prerelease_label }}${{ inputs.prerelease_iteration }}"
          if ("${{ inputs.skip_build }}" -eq "true") {
            & ./tools/publishing/Publish-PreviewModule.ps1 `
              -Owner "${{ github.repository_owner }}" `
              -Repository "${{ github.event.repository.name }}" `
              -ModuleVersion "${{ inputs.module_version }}" `
              -Prerelease $prerelease `
              -SkipBuild
          } else {
            & ./tools/publishing/Publish-PreviewModule.ps1 `
              -Owner "${{ github.repository_owner }}" `
              -Repository "${{ github.event.repository.name }}" `
              -ModuleVersion "${{ inputs.module_version }}" `
              -Prerelease $prerelease
          }
